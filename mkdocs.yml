site_name: PHP DomTemplate
site_description: Attribute-driven HTML templates for PHP. Layout stays in HTML, render logic stays in PHP.
site_url: https://tropotek.github.io/tk-domtemplate/
repo_url: https://github.com/tropotek/tk-domtemplate
repo_name: tropotek/tk-domtemplate
edit_uri: edit/main/docs/
site_author: Tropotek
copyright: Copyright &copy; 2008-present Tropotek
docs_dir: docs
exclude_docs: |
  requirements.txt
  *.py

theme:
  name: material
  favicon: img/favicon.ico
  icon:
    logo: material/code-tags
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
    - content.action.edit

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Example site: examples.md
  - Guides:
      - Templates: templates.md
      - Repeats: repeats.md
      - Inserting templates: composition.md
      - Assets: assets.md
      - Engine: engine.md
      - Modifiers: modifiers.md
      - Builder: builder.md
      - Renderers: renderers.md
      - Alpine and HTMX: alpine-htmx.md
  - Upgrading from 8.x: upgrading.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
