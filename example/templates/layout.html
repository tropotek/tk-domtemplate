<!doctype html>
<html lang="en" data-bs-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DomTemplate examples</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/example.css">
</head>
<body>
  <nav class="navbar navbar-expand-md bg-body-tertiary border-bottom mb-4">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="index.php">DomTemplate</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item" var="nav[]"><a class="nav-link" href="#" var="link">Page</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container">
    <h1 class="h2 mb-4" var="heading">Heading</h1>

    <div var="content"></div>

    <section class="mt-5" var="sources?">
      <h2 class="h5">Source</h2>
      <div class="accordion" id="sourceList">
        <div class="accordion-item" var="source[]">
          <h3 class="accordion-header">
            <button class="accordion-button collapsed font-monospace" type="button" data-bs-toggle="collapse" var="toggle">file</button>
          </h3>
          <div class="accordion-collapse collapse" data-bs-parent="#sourceList" var="body">
            <pre class="accordion-body mb-0"><code var="code"></code></pre>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="container py-4 mt-5 border-top text-body-secondary small">
    <a href="https://github.com/tropotek/tk-domtemplate">ttek/tk-domtemplate</a> example site
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Follow the OS light/dark setting
    document.documentElement.dataset.bsTheme =
      matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  </script>
</body>
</html>
