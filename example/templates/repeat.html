<div>
  <p>
    A <code>var="name[]"</code> node is a sample row: PHP clones it once per item and the sample itself is removed.
    A <code>var="name?"</code> node is removed unless PHP shows it.
  </p>

  <h2 class="h5 mt-4">Users</h2>
  <table class="table table-striped align-middle" var="hasUsers?">
    <thead>
      <tr><th>Name</th><th>Email</th><th>Tags</th><th>Status</th></tr>
    </thead>
    <tbody>
      <tr var="user[]">
        <td var="name">Name</td>
        <td><a href="#" var="email">email</a></td>
        <td>
          <span class="badge text-bg-light border me-1" var="tag[]">tag</span>
          <span class="text-body-secondary" var="noTags?">none</span>
        </td>
        <td>
          <span class="badge text-bg-success" var="active?">Active</span>
          <span class="badge text-bg-secondary" var="inactive?">Inactive</span>
        </td>
      </tr>
    </tbody>
  </table>

  <h2 class="h5 mt-4">Tasks</h2>
  <ul class="list-group">
    <li class="list-group-item" var="task[]">Task</li>
    <li class="list-group-item text-body-secondary" var="noTasks?">No tasks yet.</li>
  </ul>
</div>
