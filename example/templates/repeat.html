<div>
  <p>
    A <code>choice</code> node is removed unless PHP makes it visible.
    A <code>repeat</code> node is a row you clone once per item.
  </p>

  <h2 class="h5 mt-4">Users</h2>
  <table class="table table-striped align-middle" choice="hasUsers">
    <thead>
      <tr><th>Name</th><th>Email</th><th>Status</th></tr>
    </thead>
    <tbody>
      <tr repeat="user">
        <td var="name">Name</td>
        <td><a href="#" var="email">email</a></td>
        <td>
          <span class="badge text-bg-success" choice="active">Active</span>
          <span class="badge text-bg-secondary" choice="inactive">Inactive</span>
        </td>
      </tr>
    </tbody>
  </table>

  <h2 class="h5 mt-4">Tasks</h2>
  <ul class="list-group">
    <li class="list-group-item" repeat="task" var="task">Task</li>
    <li class="list-group-item text-body-secondary" choice="noTasks">No tasks yet.</li>
  </ul>

  <p class="mt-4 mb-0 text-body-secondary small" choice="neverShown">This paragraph is a choice that is never made visible, so it is not in the output.</p>
</div>
