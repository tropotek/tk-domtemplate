<div>
  <p>The <code>FormParser</code> finds form fields by name, so options, values and selections are set from PHP without any template markup.</p>

  <div class="alert alert-success" choice="success">
    Form submitted. Nothing was sent anywhere; this is what PHP received:
    <pre class="mb-0 mt-2"><code var="formData"></code></pre>
  </div>

  <form id="contactForm" method="post" class="row g-3" novalidate="novalidate">
    <div class="col-md-6">
      <label class="form-label" for="fName">Name</label>
      <input class="form-control" type="text" id="fName" name="name"/>
    </div>
    <div class="col-md-6">
      <label class="form-label" for="fEmail">Email</label>
      <input class="form-control" type="email" id="fEmail" name="email" var="emailField"/>
      <div class="invalid-feedback" var="emailError"></div>
    </div>
    <div class="col-md-6">
      <label class="form-label" for="fCountry">Country</label>
      <select class="form-select" id="fCountry" name="country"></select>
    </div>
    <div class="col-md-6">
      <label class="form-label" for="fColours">Colours</label>
      <select class="form-select" id="fColours" name="colours[]" multiple="multiple" size="3"></select>
    </div>
    <div class="col-12">
      <label class="form-label" for="fComments">Comments</label>
      <textarea class="form-control" id="fComments" name="comments" rows="4"></textarea>
    </div>
    <div class="col-12">
      <button class="btn btn-primary" type="submit">Send</button>
    </div>
  </form>
</div>
